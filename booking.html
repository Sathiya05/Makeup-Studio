<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book Your Consultation | Lumière PMU Studio</title>
<meta name="description" content="Book a personalized PMU consultation — choose service, artist, date and details in a guided 5-step flow."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{rosewood:'#8B5E6B',blush:'#D8B4A8',ivory:'#FBF7F5',charcoal:'#2F2929',dusty:'#B77982'}}}}</script>
<link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg"/>
<link rel="apple-touch-icon" href="images/logo/favicon.svg"/>
<meta name="theme-color" content="#8B5E6B"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-[#FBF7F5] text-[#2F2929] antialiased">
<div id="navbar"></div>
<main class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
<p class="text-xs tracking-[.28em] uppercase text-[#B77982] font-semibold text-center">Reservations</p>
<h1 class="serif text-4xl font-semibold text-center mt-2">Book Your Consultation</h1>
<div class="gold-line mx-auto mt-4"></div>
<div id="booking-steps" class="mt-8 bg-white border border-[#EAD9D2] rounded-3xl p-5 sm:p-8">
<div class="flex items-center gap-2 sm:gap-3 justify-center" role="list" aria-label="Booking progress">
<span class="step-dot" data-step-dot role="listitem">1</span><span class="flex-1 h-0.5 bg-[#EAD9D2] max-w-[60px]"></span>
<span class="step-dot" data-step-dot role="listitem">2</span><span class="flex-1 h-0.5 bg-[#EAD9D2] max-w-[60px]"></span>
<span class="step-dot" data-step-dot role="listitem">3</span><span class="flex-1 h-0.5 bg-[#EAD9D2] max-w-[60px]"></span>
<span class="step-dot" data-step-dot role="listitem">4</span><span class="flex-1 h-0.5 bg-[#EAD9D2] max-w-[60px]"></span>
<span class="step-dot" data-step-dot role="listitem">5</span>
</div>
<div class="mt-3 h-1.5 bg-[#F1E4DD] rounded-full overflow-hidden"><div id="book-progress" class="h-full bg-[#8B5E6B] transition-all" style="width:20%"></div></div>
<form id="booking-form" class="mt-6" novalidate>
<div class="book-step"><h2 class="serif text-2xl font-semibold">Step 1 — Choose Service</h2><div class="mt-4 grid sm:grid-cols-2 gap-3">
<label class="border border-[#EAD9D2] rounded-2xl p-4 flex gap-3 cursor-pointer hover:border-[#8B5E6B]"><input type="radio" name="service" value="Microblading" required class="mt-1 accent-[#8B5E6B]"/><span><strong class="text-sm">Microblading</strong><br/><span class="text-xs text-gray-500">Hair-strokes · from $349</span></span></label>
<label class="border border-[#EAD9D2] rounded-2xl p-4 flex gap-3 cursor-pointer hover:border-[#8B5E6B]"><input type="radio" name="service" value="Powder Brows" class="mt-1 accent-[#8B5E6B]"/><span><strong class="text-sm">Powder Brows</strong><br/><span class="text-xs text-gray-500">Soft shading · from $329</span></span></label>
<label class="border border-[#EAD9D2] rounded-2xl p-4 flex gap-3 cursor-pointer hover:border-[#8B5E6B]"><input type="radio" name="service" value="Combination Brows" class="mt-1 accent-[#8B5E6B]"/><span><strong class="text-sm">Combination Brows</strong><br/><span class="text-xs text-gray-500">Strokes + shade · from $379</span></span></label>
<label class="border border-[#EAD9D2] rounded-2xl p-4 flex gap-3 cursor-pointer hover:border-[#8B5E6B]"><input type="radio" name="service" value="Lip Blush" class="mt-1 accent-[#8B5E6B]"/><span><strong class="text-sm">Lip Blush</strong><br/><span class="text-xs text-gray-500">Sheer tint · from $299</span></span></label>
</div><div class="mt-6 flex justify-end"><button type="button" data-next class="btn-primary px-7 py-3 rounded-full text-sm font-semibold">Next →</button></div></div>
<div class="book-step hidden"><h2 class="serif text-2xl font-semibold">Step 2 — Choose Artist</h2><div class="mt-4 grid sm:grid-cols-3 gap-3">
<label class="border border-[#EAD9D2] rounded-2xl p-4 text-center cursor-pointer hover:border-[#8B5E6B]"><img src="images/artists/sophia-booking.jpg" alt="Sophia Laurent" loading="lazy" class="w-full h-32 object-cover rounded-xl"/><input type="radio" name="artist" value="Sophia Laurent" required class="mt-3 accent-[#8B5E6B]"/><p class="text-sm font-semibold mt-1">Sophia Laurent</p></label>
<label class="border border-[#EAD9D2] rounded-2xl p-4 text-center cursor-pointer hover:border-[#8B5E6B]"><img src="images/artists/maya-booking.jpg" alt="Maya Bennett" loading="lazy" class="w-full h-32 object-cover rounded-xl"/><input type="radio" name="artist" value="Maya Bennett" class="mt-3 accent-[#8B5E6B]"/><p class="text-sm font-semibold mt-1">Maya Bennett</p></label>
<label class="border border-[#EAD9D2] rounded-2xl p-4 text-center cursor-pointer hover:border-[#8B5E6B]"><img src="images/artists/elena-booking.jpg" alt="Elena Rose" loading="lazy" class="w-full h-32 object-cover rounded-xl"/><input type="radio" name="artist" value="Elena Rose" class="mt-3 accent-[#8B5E6B]"/><p class="text-sm font-semibold mt-1">Elena Rose</p></label>
</div><div class="mt-6 flex justify-between"><button type="button" data-back class="px-6 py-3 rounded-full text-sm font-semibold border border-[#EAD9D2]">← Back</button><button type="button" data-next class="btn-primary px-7 py-3 rounded-full text-sm font-semibold">Next →</button></div></div>
<div class="book-step hidden"><h2 class="serif text-2xl font-semibold">Step 3 — Date &amp; Time</h2><div class="mt-4 grid sm:grid-cols-2 gap-4"><div><label for="bk-date" class="text-sm font-semibold">Preferred Date</label><input id="bk-date" name="date" type="date" required class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"/></div><div><label for="bk-time" class="text-sm font-semibold">Preferred Time</label><select id="bk-time" name="time" required class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"><option value="">Select…</option><option>9:00 AM</option><option>11:00 AM</option><option>2:00 PM</option><option>4:00 PM</option></select></div></div><div class="mt-6 flex justify-between"><button type="button" data-back class="px-6 py-3 rounded-full text-sm font-semibold border border-[#EAD9D2]">← Back</button><button type="button" data-next class="btn-primary px-7 py-3 rounded-full text-sm font-semibold">Next →</button></div></div>
<div class="book-step hidden"><h2 class="serif text-2xl font-semibold">Step 4 — Client Details</h2><div class="mt-4 grid sm:grid-cols-2 gap-4">
<div><label for="bk-name" class="text-sm font-semibold">Full Name</label><input id="bk-name" name="name" required placeholder="Jane Doe" class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"/></div>
<div><label for="bk-email" class="text-sm font-semibold">Email</label><input id="bk-email" name="email" type="email" required placeholder="you@example.com" class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"/></div>
<div><label for="bk-phone" class="text-sm font-semibold">Phone</label><input id="bk-phone" name="phone" required placeholder="+1 212 555 0000" class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"/></div>
<div><label for="bk-msg" class="text-sm font-semibold">Message</label><input id="bk-msg" name="message" placeholder="Goals, questions…" class="mt-1 w-full px-4 py-3 rounded-xl border border-[#EAD9D2] bg-[#FBF7F5]"/></div>
<label class="sm:col-span-2 flex gap-2 text-xs text-gray-600"><input type="checkbox" name="agree" required class="mt-0.5 accent-[#8B5E6B]"/> I agree to the studio's appointment policies.</label>
</div><div class="mt-6 flex justify-between"><button type="button" data-back class="px-6 py-3 rounded-full text-sm font-semibold border border-[#EAD9D2]">← Back</button><button type="submit" class="btn-primary px-7 py-3 rounded-full text-sm font-semibold">Submit Request</button></div></div>
<div class="book-step hidden text-center py-4"><p class="w-16 h-16 mx-auto rounded-full bg-[#e6f4ea] text-2xl flex items-center justify-center">✓</p><h2 class="serif text-2xl font-semibold mt-4">Request Received</h2><p class="text-sm text-gray-600 mt-2">Thank you — our team will confirm shortly.</p><div id="booking-summary" class="text-left mt-5 bg-[#FBF7F5] border border-[#EAD9D2] rounded-2xl p-4"></div><a href="index.html" class="btn-primary inline-block mt-6 px-7 py-3 rounded-full text-sm font-semibold">Back to Home</a></div>
</form>
</div>
</main>
<div id="footer"></div>
<script src="js/navbar.js"></script><script src="js/footer.js"></script><script src="js/main.js"></script>
</body>
</html>
